<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Pop 98</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100dvh;
    background: #008080;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    user-select: none;
}

.window {
    width: 100%;
    max-width: 780px;
    background: #c0c0c0;
    padding: 5px;
    border: 3px solid;
    border-color: white #404040 #404040 white;
    box-shadow: 7px 7px 0 #0004;
}

.titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    padding: 10px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 5px;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.retro-button {
    background: #c0c0c0;
    border: 3px solid;
    border-color: white #404040 #404040 white;
    padding: 8px 12px;
    font-weight: bold;
    color: black;
    touch-action: manipulation;
}

.retro-button:active {
    border-color: #404040 white white #404040;
}

.intro {
    text-align: center;
    padding: 5px 10px 15px;
}

h1 {
    font-size: clamp(23px, 5vw, 38px);
    margin: 8px 0;
    letter-spacing: -2px;
    color: #000080;
    text-shadow: 2px 2px white;
}

.intro p {
    font-size: 12px;
    margin: 5px 0;
}

.counter {
    background: #111;
    color: #39ff14;
    padding: 8px 10px;
    font-weight: bold;
    font-size: 14px;
    border: 2px inset #ddd;
}

.foil {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 7px;
    padding: 12px;
    background:
        repeating-linear-gradient(
            45deg,
            #ffffff30 0px,
            #ffffff30 1px,
            transparent 1px,
            transparent 5px
        ),
        linear-gradient(135deg, #b5c8ce, #eef5f5, #9baeb6);
    border: 3px inset #ddd;
}

.bubble {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    padding: 0;
    border-radius: 50%;
    border: 1px solid #82949b;
    background:
        radial-gradient(
            ellipse at 30% 22%,
            #ffffff 0%,
            #ffffffbb 10%,
            transparent 32%
        ),
        radial-gradient(
            circle at 42% 35%,
            #eefbff 0%,
            #c9dce2 45%,
            #a2b6bf 75%,
            #70868f 100%
        );
    box-shadow:
        inset 2px 3px 5px #fff,
        inset -4px -5px 8px #50636b66,
        2px 4px 5px #40515b55;
    transition: transform 0.12s, box-shadow 0.12s;
    touch-action: manipulation;
}

.bubble::before {
    content: "";
    position: absolute;
    inset: 5%;
    border-radius: 50%;
    border: 1px solid #ffffff88;
}

.bubble:focus-visible {
    outline: 2px dashed navy;
    outline-offset: 2px;
}

@media (hover: hover) {
    .bubble:not(.popped):hover {
        filter: brightness(1.12);
        transform: scale(1.05);
    }
}

.bubble.popped {
    transform: scale(0.89);
    background:
        repeating-conic-gradient(
            from 20deg,
            #ffffff55 0deg,
            #7b929733 15deg,
            transparent 35deg,
            #ffffff66 50deg
        ),
        radial-gradient(
            circle,
            #a5b5bb,
            #c7d5d9 55%,
            #879ca5 100%
        );
    box-shadow:
        inset 2px 3px 8px #455b6266,
        inset -2px -2px 3px white;
    border: 1px dashed #8a9ca3;
}

.bubble.popped::before {
    inset: 25%;
    border-radius: 25% 60% 35% 50%;
    border: 1px solid #778c9366;
}

.pop-text {
    position: absolute;
    z-index: 5;
    top: 20%;
    left: 50%;
    pointer-events: none;
    color: #000080;
    font-size: 17px;
    font-weight: 900;
    white-space: nowrap;
    text-shadow: 1px 1px white;
    animation: floatUp 0.65s ease-out forwards;
}

@keyframes floatUp {
    0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(0.6);
    }
    25% {
        transform: translate(-50%, -12px) scale(1.3);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -45px) scale(1);
    }
}

.bubble.refill {
    animation: inflate 0.4s ease-out;
}

@keyframes inflate {
    0% { transform: scale(0.7); }
    65% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.statusbar {
    margin-top: 8px;
    border: 2px inset #eee;
    padding: 7px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 5px;
}

.footer {
    text-align: center;
    font-size: 10px;
    padding: 12px 0 5px;
    color: #555;
}

@media (max-width: 550px) {
    .foil {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 5px;
        padding: 8px;
    }

    .toolbar {
        gap: 5px;
    }

    .retro-button {
        padding: 7px;
        font-size: 12px;
    }

    .counter {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<main class="window">

    <div class="titlebar">
        <span>▣ Bubble Pop 98.exe</span>
        <span>_ □</span>
    </div>

    <div class="intro">
        <h1>BUBBLE POP '98</h1>
        <p>THE ULTIMATE STRESS DESTROYER</p>
        <p>Keine Termine. Keine Aufgaben. Nur Plopp.</p>
    </div>

    <div class="toolbar">
        <button class="retro-button" id="sound"
                aria-label="Ton ausschalten"
                aria-pressed="true">
            🔊 TON AN
        </button>

        <div class="counter">
            POP: <span id="count">000000</span>
        </div>

        <button class="retro-button" id="reset">
            ↻ NEU
        </button>
    </div>

    <div class="foil" id="foil"></div>

    <div class="statusbar">
        <span id="status">● Bereit zum Ploppen</span>
        <span>∞ ENDLOS</span>
    </div>

    <div class="footer">
        © 1998 BubbleSoft · 100% Stressabbau-Modus
    </div>

</main>

<script>
const foil = document.getElementById("foil");
const counter = document.getElementById("count");
const soundButton = document.getElementById("sound");
const status = document.getElementById("status");

let pops = 0;
let soundEnabled = true;
let audioContext;
let masterGain;

const refillTime = 2500;

const words = [
    "PLOPP!",
    "BOING!",
    "PUFF!",
    "PIP!",
    "BLUB!",
    "PATSCH!",
    "PÖCK!",
    "POINK!"
];

const messages = [
    "Stress erfolgreich vernichtet!",
    "Ein Problem weniger.",
    "Plopp.exe funktioniert!",
    "Sehr befriedigend ...",
    "Entspannung wird geladen ...",
    "Alles easy!",
    "Therapie für die Finger.",
    "Bitte weiterploppen!"
];

function random(min, max) {
    return min + Math.random() * (max - min);
}

function initAudio() {
    if (!audioContext) {
        const AudioClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioClass) return false;

        audioContext = new AudioClass();
        masterGain = audioContext.createGain();
        masterGain.gain.value = soundEnabled ? 0.6 : 0;
        masterGain.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
    }

    return true;
}

// Kurzes elektronisches Retro-Geräusch
function tone(start, end, duration, type, volume, delay = 0) {
    const now = audioContext.currentTime + delay;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(start, now);
    oscillator.frequency.exponentialRampToValueAtTime(
        end, now + duration
    );

    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(
        0.001, now + duration
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);
    oscillator.stop(now + duration);
}

// Knackendes Luftpolster-Geräusch
function crackle() {
    const duration = 0.075;
    const length = Math.floor(
        audioContext.sampleRate * duration
    );

    const buffer = audioContext.createBuffer(
        1, length, audioContext.sampleRate
    );

    const data = buffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        data[i] =
            (Math.random() * 2 - 1) *
            Math.exp(-i / (length * 0.12));
    }

    const source = audioContext.createBufferSource();
    const filter = audioContext.createBiquadFilter();
    const gain = audioContext.createGain();

    source.buffer = buffer;
    filter.type = "lowpass";
    filter.frequency.value = random(1200, 4000);
    gain.gain.value = 0.45;

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    source.start();
}

// Acht verschiedene Soundeffekte
function playPop(type) {
    if (!soundEnabled || !initAudio()) return;

    const pitch = random(0.85, 1.15);

    switch (type) {
        case 0:
            crackle();
            tone(350 * pitch, 65, 0.09, "sine", 0.4);
            break;

        case 1:
            tone(180, 750 * pitch, 0.12, "triangle", 0.3);
            tone(750, 110, 0.18, "sine", 0.2, 0.08);
            break;

        case 2:
            crackle();
            tone(140, 40, 0.14, "triangle", 0.3);
            break;

        case 3:
            tone(1200 * pitch, 500, 0.08, "square", 0.09);
            break;

        case 4:
            tone(500, 90, 0.13, "sine", 0.4);
            tone(300, 70, 0.09, "sine", 0.2, 0.06);
            break;

        case 5:
            crackle();
            tone(220, 55, 0.07, "triangle", 0.4);
            break;

        case 6:
            tone(800 * pitch, 100, 0.055, "triangle", 0.35);
            break;

        case 7:
            tone(400, 1400 * pitch, 0.09, "sine", 0.3);
            tone(900, 200, 0.12, "triangle", 0.15, 0.06);
            break;
    }
}

function popBubble(bubble) {
    if (bubble.classList.contains("popped")) return;

    bubble.classList.remove("refill");
    bubble.classList.add("popped");
    bubble.setAttribute("aria-label", "Zerdrücktes Luftpolster");

    pops++;
    counter.textContent = String(pops).padStart(6, "0");

    const type = Math.floor(Math.random() * words.length);

    playPop(type);

    // Lustiger Plopp-Schriftzug
    const text = document.createElement("span");
    text.className = "pop-text";
    text.textContent = words[type];
    bubble.appendChild(text);

    setTimeout(() => text.remove(), 650);

    status.textContent = "● " + messages[type];

    // Kurze Vibration auf unterstützten Handys
    if (navigator.vibrate) {
        navigator.vibrate(12);
    }

    // Luftpolster automatisch wieder aufblasen
    setTimeout(() => {
        if (!bubble.isConnected) return;

        bubble.classList.remove("popped");
        bubble.classList.add("refill");
        bubble.setAttribute("aria-label", "Luftpolster zerdrücken");

        setTimeout(() => {
            bubble.classList.remove("refill");
        }, 400);

    }, refillTime + random(0, 800));
}

function createFoil() {
    foil.innerHTML = "";

    for (let i = 0; i < 48; i++) {
        const bubble = document.createElement("button");

        bubble.className = "bubble";
        bubble.type = "button";
        bubble.setAttribute(
            "aria-label", "Luftpolster zerdrücken"
        );

        // Maus, Touch und Stift
        bubble.addEventListener("pointerdown", event => {
            if (event.button !== 0) return;
            popBubble(bubble);
        });

        // Auch mit der Tastatur bedienbar
        bubble.addEventListener("click", event => {
            if (event.detail === 0) {
                popBubble(bubble);
            }
        });

        foil.appendChild(bubble);
    }
}

soundButton.addEventListener("click", () => {
    soundEnabled = !soundEnabled;

    soundButton.textContent =
        soundEnabled ? "🔊 TON AN" : "🔇 TON AUS";

    soundButton.setAttribute(
        "aria-pressed", String(soundEnabled)
    );

    soundButton.setAttribute(
        "aria-label",
        soundEnabled ? "Ton ausschalten" : "Ton einschalten"
    );

    if (masterGain) {
        masterGain.gain.value = soundEnabled ? 0.6 : 0;
    }
});

document.getElementById("reset")
    .addEventListener("click", () => {
        createFoil();
        status.textContent = "● Frische Luftpolsterfolie!";
    });

createFoil();
</script>

</body>
</html>
