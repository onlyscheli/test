<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Luftpolsterfolie</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    display: flex;
    flex-direction: column;
    background: #c0c0c0;
    font-family: Tahoma, Arial, sans-serif;
    user-select: none;
}

header {
    padding: 4px;
    border: 3px solid;
    border-color: white #444 #444 white;
    flex-shrink: 0;
}

.titlebar {
    background: linear-gradient(90deg, navy, #1084d0);
    color: white;
    padding: 9px;
    font-weight: bold;
}

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 2px;
}

button {
    background: #c0c0c0;
    border: 3px solid;
    border-color: white #444 #444 white;
    padding: 8px;
    min-height: 38px;
    cursor: pointer;
    font-weight: bold;
    touch-action: manipulation;
}

button:active {
    border-color: #444 white white #444;
}

button.active {
    background: #a5bda5;
    border-color: #444 white white #444;
}

.speed {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
}

input {
    width: clamp(60px, 24vw, 180px);
    accent-color: navy;
}

main {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #b4c3c8;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
}

footer {
    padding: 6px 8px;
    font-size: 11px;
    border: 2px solid;
    border-color: white #444 #444 white;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<header>
    <div class="titlebar">Luftpolsterfolie</div>

    <div class="toolbar">
        <button id="sound" aria-label="Ton ausschalten">
            🔊
        </button>

        <div class="speed">
            <label for="speed">Tempo</label>
            <input id="speed" type="range"
                   min="0" max="80" value="18">
        </div>

        <button id="eco" class="active"
                aria-pressed="true">
            ECO
        </button>

        <button id="fullscreen"
                aria-label="Vollbild">⛶</button>
    </div>
</header>

<main id="area">
    <canvas id="canvas"></canvas>
</main>

<footer>
    <span>Klicken oder wischen</span>
    <span id="mode">ECO · 30 FPS</span>
</footer>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });
const area = document.getElementById("area");
const speed = document.getElementById("speed");

let eco = true;
let soundEnabled = true;
let width = 0;
let height = 0;
let bubbles = [];
let cell = 52;
let columns = 6;
let nextY = 0;
let lastFrame = 0;
let dirty = true;

const pointers = new Map();
const sprites = {};
const random = (a, b) => a + Math.random() * (b - a);

/* ==================================
   LUFTPOLSTER-GRAFIKEN
   Nur einmal vorberechnen!
================================== */

function makeSprite(size, popped) {
    const image = document.createElement("canvas");
    image.width = size;
    image.height = size;

    const c = image.getContext("2d");
    const r = size * 0.44;
    const x = size / 2;
    const y = size / 2;

    c.save();
    c.translate(x, y);

    c.beginPath();
    c.ellipse(0, 0, r, r * 0.97, 0, 0, Math.PI * 2);

    if (!popped) {

        const gradient = c.createRadialGradient(
            -r * 0.32, -r * 0.35, 0,
            0, 0, r
        );

        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.17, "#e9f4f7");
        gradient.addColorStop(0.42, "#d0dfe4");
        gradient.addColorStop(0.76, "#aabdc5");
        gradient.addColorStop(0.92, "#879da6");
        gradient.addColorStop(1, "#dce7eb");

        c.shadowColor = "#40565d66";
        c.shadowBlur = size * 0.035;
        c.shadowOffsetY = size * 0.025;

        c.fillStyle = gradient;
        c.fill();

        c.shadowBlur = 0;
        c.shadowOffsetY = 0;

        c.strokeStyle = "#778d9688";
        c.lineWidth = 1;
        c.stroke();

        // Transparenter Schweißrand
        c.beginPath();
        c.ellipse(0, 0, r * 0.88, r * 0.86,
                  0, 0, Math.PI * 2);
        c.strokeStyle = "#ffffff88";
        c.stroke();

        // Lichtreflexion
        c.beginPath();
        c.ellipse(
            -r * 0.34, -r * 0.43,
            r * 0.37, r * 0.15,
            -0.55, 0, Math.PI * 2
        );

        c.fillStyle = "#ffffffdd";
        c.fill();

        c.beginPath();
        c.arc(0, 0, r * 0.78, 0.2, 1.3);
        c.strokeStyle = "#ffffff99";
        c.lineWidth = size * 0.025;
        c.stroke();

    } else {

        // Flache, zerknitterte Folie
        const gradient = c.createRadialGradient(
            0, 0, 0, 0, 0, r
        );

        gradient.addColorStop(0, "#9aabb2");
        gradient.addColorStop(0.65, "#c6d3d7");
        gradient.addColorStop(1, "#afbec4");

        c.fillStyle = gradient;
        c.fill();

        c.strokeStyle = "#84989f88";
        c.lineWidth = 1;
        c.stroke();

        c.clip();

        // Zufällige Falten
        for (let i = 0; i < 17; i++) {

            const a = random(0, Math.PI * 2);
            const end = random(r * 0.4, r);

            c.beginPath();
            c.moveTo(
                random(-r * 0.3, r * 0.3),
                random(-r * 0.3, r * 0.3)
            );

            c.lineTo(
                Math.cos(a) * end * 0.6,
                Math.sin(a) * end * 0.6
            );

            c.lineTo(
                Math.cos(a + 0.2) * end,
                Math.sin(a + 0.2) * end
            );

            c.strokeStyle = i % 2
                ? "#ffffff99"
                : "#647b8566";

            c.lineWidth = random(0.5, 1.8);
            c.stroke();
        }
    }

    c.restore();
    return image;
}

function prepareSprites() {
    sprites.small = makeSprite(96, false);
    sprites.large = makeSprite(192, false);

    sprites.flat = Array.from(
        { length: 5 },
        () => makeSprite(96, true)
    );

    sprites.flatLarge = Array.from(
        { length: 5 },
        () => makeSprite(192, true)
    );
}

/* ==================================
   KNACKGERÄUSCHE
   Vorberechnete Audio-Samples
================================== */

let audio;
let master;
let compressor;
let activeSounds = 0;

const samples = {
    small: [],
    large: []
};

function initAudio() {
    if (!audio) {

        const AudioClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioClass) return false;

        audio = new AudioClass();

        master = audio.createGain();
        master.gain.value = soundEnabled ? 0.65 : 0;

        compressor = audio.createDynamicsCompressor();
        compressor.threshold.value = -12;
        compressor.ratio.value = 6;

        master.connect(compressor);
        compressor.connect(audio.destination);

        // Geräusche einmal erzeugen und speichern.
        for (let i = 0; i < 12; i++) {
            samples.small.push(makeCrack(false));
            samples.large.push(makeCrack(true));
        }
    }

    if (audio.state === "suspended") {
        audio.resume().catch(() => {});
    }

    return true;
}

function makeCrack(large) {

    const rate = audio.sampleRate;
    const duration = large ? 0.13 : 0.065;

    const buffer = audio.createBuffer(
        1, Math.floor(rate * duration), rate
    );

    const data = buffer.getChannelData(0);

    const decay = large
        ? random(0.007, 0.013)
        : random(0.002, 0.004);

    const frequency = large
        ? random(95, 180)
        : random(300, 500);

    let previous = 0;

    for (let i = 0; i < data.length; i++) {

        const t = i / rate;
        const noise = Math.random() * 2 - 1;

        // Große Polster klingen dumpfer.
        const smoothing = large ? 0.38 : 0.85;

        previous += smoothing * (noise - previous);

        const attack = Math.min(1, t / 0.0002);

        const crack =
            previous *
            Math.exp(-t / decay) *
            attack;

        const thump =
            Math.sin(
                2 * Math.PI * frequency * t *
                (1 - Math.min(t * 5, 0.6))
            ) *
            Math.exp(-t / 0.012) *
            (large ? 0.45 : 0.12);

        const rustle =
            noise * Math.exp(-t / 0.025) * 0.045;

        data[i] = crack + thump + rustle;
    }

    return buffer;
}

function playPop(large) {

    if (!soundEnabled || !initAudio()) return;

    // Verhindert Audio-Überlastung beim Wischen.
    if (activeSounds >= 12) return;

    const list = large ? samples.large : samples.small;

    const source = audio.createBufferSource();
    const gain = audio.createGain();

    source.buffer =
        list[Math.floor(Math.random() * list.length)];

    source.playbackRate.value = random(0.9, 1.1);

    gain.gain.value = large
        ? random(0.85, 1.05)
        : random(0.25, 0.42);

    source.connect(gain);
    gain.connect(master);

    activeSounds++;

    source.onended = () => {
        activeSounds--;
        source.disconnect();
        gain.disconnect();
    };

    source.start();
}

/* ==================================
   ENDLOSE FOLIE
================================== */

function addStrip(y) {

    const rows = 2;

    const occupied = Array.from(
        { length: rows },
        () => Array(columns).fill(false)
    );

    for (let r = 0; r < rows; r++) {

        for (let c = 0; c < columns; c++) {

            if (occupied[r][c]) continue;

            let large = false;

            if (
                r === 0 &&
                c < columns - 1 &&
                !occupied[0][c + 1] &&
                !occupied[1][c] &&
                !occupied[1][c + 1] &&
                Math.random() < 0.17
            ) {
                large = true;

                occupied[0][c + 1] = true;
                occupied[1][c] = true;
                occupied[1][c + 1] = true;
            }

            occupied[r][c] = true;

            const size = cell * (large ? 2 : 1);

            bubbles.push({
                x: c * cell + size / 2,
                y: y + r * cell + size / 2,
                size,
                large,
                popped: false,
                variant: Math.floor(Math.random() * 5)
            });
        }
    }
}

function resize() {

    width = area.clientWidth;
    height = area.clientHeight;

    // ECO nutzt eine geringere Renderauflösung.
    const resolution = eco
        ? 1
        : Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.max(1, Math.round(width * resolution));
    canvas.height = Math.max(1, Math.round(height * resolution));

    ctx.setTransform(resolution, 0, 0, resolution, 0, 0);

    columns = Math.max(4, Math.floor(width / 54));
    cell = width / columns;

    bubbles = [];

    for (let y = -cell * 2; y < height + cell * 2;
         y += cell * 2) {

        addStrip(y);
    }

    nextY = -cell * 2;
    dirty = true;

    draw();
}

function draw() {

    ctx.fillStyle = "#b4c3c8";
    ctx.fillRect(0, 0, width, height);

    for (const b of bubbles) {

        if (
            b.y + b.size / 2 < 0 ||
            b.y - b.size / 2 > height
        ) continue;

        let sprite;

        if (b.popped) {
            sprite = b.large
                ? sprites.flatLarge[b.variant]
                : sprites.flat[b.variant];
        } else {
            sprite = b.large
                ? sprites.large
                : sprites.small;
        }

        ctx.drawImage(
            sprite,
            b.x - b.size / 2,
            b.y - b.size / 2,
            b.size,
            b.size
        );
    }

    dirty = false;
}

/* ==================================
   MAUS UND TOUCH
================================== */

function popAt(x, y) {

    for (const b of bubbles) {

        if (b.popped) continue;

        const dx = x - b.x;
        const dy = y - b.y;
        const radius = b.size * 0.46;

        if (dx * dx + dy * dy <= radius * radius) {

            b.popped = true;
            dirty = true;

            playPop(b.large);
            return;
        }
    }
}

function position(e) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

canvas.addEventListener("pointerdown", e => {

    if (e.button !== 0) return;

    e.preventDefault();

    if (soundEnabled) initAudio();

    const p = position(e);

    pointers.set(e.pointerId, p);
    canvas.setPointerCapture(e.pointerId);

    popAt(p.x, p.y);
});

canvas.addEventListener("pointermove", e => {

    const old = pointers.get(e.pointerId);

    if (!old) return;

    const p = position(e);

    const dx = p.x - old.x;
    const dy = p.y - old.y;

    const steps = Math.max(
        1,
        Math.ceil(Math.hypot(dx, dy) / 12)
    );

    for (let i = 1; i <= steps; i++) {

        popAt(
            old.x + dx * i / steps,
            old.y + dy * i / steps
        );
    }

    pointers.set(e.pointerId, p);
});

function release(e) {
    pointers.delete(e.pointerId);
}

canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("lostpointercapture", release);

window.addEventListener("blur", () => pointers.clear());

/* ==================================
   RESSOURCENSCHONENDE ANIMATION
================================== */

function animate(time) {

    requestAnimationFrame(animate);

    if (document.hidden) {
        lastFrame = time;
        return;
    }

    const interval = eco ? 1000 / 30 : 1000 / 60;
    const elapsed = time - lastFrame;

    if (elapsed < interval - 1) return;

    const dt = Math.min(elapsed / 1000, 0.1);

    lastFrame = time;

    const movement = Number(speed.value) * dt;

    if (movement > 0) {

        for (const b of bubbles) {
            b.y += movement;
        }

        nextY += movement;

        // Unsichtbare Luftpolster sofort entfernen.
        bubbles = bubbles.filter(
            b => b.y - b.size / 2 < height
        );

        // Neue Folie von oben nachschieben.
        while (nextY >= 0) {

            nextY -= cell * 2;
            addStrip(nextY);
        }

        dirty = true;
    }

    for (const p of pointers.values()) {
        popAt(p.x, p.y);
    }

    // Bei Stillstand nur zeichnen,
    // wenn sich wirklich etwas verändert hat.
    if (dirty) draw();
}

/* ==================================
   BEDIENELEMENTE
================================== */

const soundButton = document.getElementById("sound");

soundButton.addEventListener("click", () => {

    soundEnabled = !soundEnabled;

    soundButton.textContent =
        soundEnabled ? "🔊" : "🔇";

    soundButton.setAttribute(
        "aria-label",
        soundEnabled ? "Ton ausschalten" : "Ton einschalten"
    );

    if (soundEnabled) initAudio();

    if (master) {
        master.gain.setTargetAtTime(
            soundEnabled ? 0.65 : 0,
            audio.currentTime,
            0.005
        );
    }
});

document.getElementById("eco")
    .addEventListener("click", function() {

        eco = !eco;

        this.classList.toggle("active", eco);
        this.setAttribute("aria-pressed", String(eco));

        document.getElementById("mode").textContent =
            eco ? "ECO · 30 FPS" : "HD · 60 FPS";

        resize();
    });

const full = document.getElementById("fullscreen");

if (!document.documentElement.requestFullscreen) {
    full.hidden = true;
}

full.addEventListener("click", async () => {

    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (e) {}
});

let resizeTimer;

window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
});

prepareSprites();
resize();

lastFrame = performance.now();

requestAnimationFrame(animate);
</script>

</body>
</html>
