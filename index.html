
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2187109190409697"
    crossorigin="anonymous"></script>

  <title>onlyscheli</title>

  <!-- favicon -->
  <link rel="icon" type="image/jpeg" href="./1792328531760.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      text-transform: lowercase;
      overflow-x: hidden;
    }

    /* startbereich */
    .hero {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .emoji {
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin-bottom: 24px;
      user-select: none;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    /* hauptbereich */
    .content {
      min-height: 35vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 40px;
    }

    .main-navigation {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* buttons */
    .links-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #000000;
      color: #000000;
      text-decoration: none;
      text-align: center;
      font-size: 1rem;
      font-weight: 400;
      border-radius: 8px;
      transition: background-color 0.2s ease,
                  color 0.2s ease;
    }

    .link-card:hover {
      background-color: #000000;
      color: #ffffff;
    }

    /* instagram icon */
    .instagram-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* footer */
    footer {
      margin-top: 60px;
      font-size: 0.85rem;
      text-align: center;
      opacity: 0.7;
    }

    footer a {
      color: #000000;
      text-decoration: none;
      margin: 0 8px;
      transition: opacity 0.2s ease;
    }

    footer a:hover {
      opacity: 0.5;
      text-decoration: underline;
    }

    /* mobile ansicht */
    @media (max-width: 600px) {
      .hero {
        min-height: 55vh;
      }

      .emoji {
        width: 130px;
        height: 130px;
      }

      .title {
        font-size: 2rem;
      }

      .content {
        min-height: 45vh;
        padding: 10px 20px 30px;
      }

      .links-container {
        max-width: 400px;
      }

      footer {
        margin-top: 50px;
      }
    }
  </style>
</head>

<body>

  <!-- startbereich -->
  <section class="hero">

    <img
      src="1792328531760.jpg"
      alt="onlyscheli emoji"
      class="emoji"
    >

    <h1 class="title">onlyscheli</h1>

  </section>

  <!-- links -->
  <main class="content">

    <div class="main-navigation">

      <div class="links-container">

        <!-- foodpairingguide -->
        <a
          href="https://onlyscheli.com/pairing"
          class="link-card"
          target="_blank"
          rel="noopener noreferrer"
        >
          foodpairingguide
        </a>

        <!-- instagram craftbeerpairing -->
        <a
          href="https://instagram.com/craftbeerpairing"
          class="link-card"
          target="_blank"
          rel="noopener noreferrer"
        >

          <!-- instagram logo als svg -->
          <svg
            class="instagram-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect
              x="2"
              y="2"
              width="20"
              height="20"
              rx="5"
              ry="5"
            />
            <circle
              cx="12"
              cy="12"
              r="4"
            />
            <circle
              cx="17.5"
              cy="6.5"
              r="1"
              fill="currentColor"
              stroke="none"
            />
          </svg>

          craftbeerpairing
        </a>

        <!-- impressum -->
        <a
          href="impressum.html"
          class="link-card"
        >
          impressum
        </a>

        <!-- datenschutz -->
        <a
          href="datenschutz.html"
          class="link-card"
        >
          datenschutz
        </a>

      </div>

    </div>

    <!-- footer -->
    <footer>
      <a href="impressum.html">impressum</a> |
      <a href="datenschutz.html">datenschutz</a>
    </footer>

  </main>

</body>
</html>
