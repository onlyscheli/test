<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>onlyscheli</title>
  <style>
    /* Grundlegende Einstellungen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-transform: lowercase; /* Erzwingt durchgehend Kleinschreibung */
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Startansicht (100% Bildschirmhöhe) */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .emoji {
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin-bottom: 24px;
      user-select: none;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    /* Dezenter Hinweis zum Scrollen */
    .scroll-hint {
      position: absolute;
      bottom: 30px;
      font-size: 0.85rem;
      opacity: 0.4;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    /* Bereich nach dem Scrollen */
    .content {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 80px 20px 40px 20px;
    }

    .main-navigation {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Navigation / Menü */
    nav {
      margin-bottom: 60px;
    }

    .menu {
      list-style: none;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .menu a {
      color: #000000;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    .menu a:hover {
      opacity: 0.5;
    }

    /* Links / Platzhalter für spätere Seiten */
    .links-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #000000;
      color: #000000;
      text-decoration: none;
      text-align: center;
      font-size: 1rem;
      border-radius: 8px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .link-card:hover {
      background-color: #000000;
      color: #ffffff;
    }

    /* Footer für Rechtliches */
    footer {
      margin-top: 60px;
      font-size: 0.85rem;
      text-align: center;
      opacity: 0.7;
    }

    footer a {
      color: #000000;
      text-decoration: none;
      margin: 0 8px;
      transition: opacity 0.2s ease;
    }

    footer a:hover {
      opacity: 0.5;
      text-decoration: underline;
    }

    /* Responsive Anpassungen für Mobilgeräte */
    @media (max-width: 600px) {
      .emoji {
        width: 130px;
        height: 130px;
      }

      .title {
        font-size: 2rem;
      }

      .menu {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Bereich: Nur Emoji & Name -->
  <section class="hero">
    <!-- Ersetze '1792328531760.jpg' mit dem echten Pfad deines Emojis -->
    <img src="1792328531760.jpg" alt="onlyscheli emoji" class="emoji">
    <h1 class="title">onlyscheli</h1>
    <div class="scroll-hint">runterscrollen ↓</div>
  </section>

  <!-- 2. Bereich: Menü & Verlinkungen (erst nach dem Scrollen sichtbar) -->
  <main class="content">
    <div class="main-navigation">
      <nav>
        <ul class="menu">
          <li><a href="#about">über mich</a></li>
          <li><a href="#projects">projekte</a></li>
          <li><a href="#contact">kontakt</a></li>
        </ul>
      </nav>

      <!-- Verlinkungen zu weiteren Seiten -->
      <div class="links-container">
        <a href="#" class="link-card">link 1 (demnächst)</a>
        <a href="#" class="link-card">link 2 (demnächst)</a>
        <a href="#" class="link-card">social media</a>
        <a href="impressum.html" class="link-card">impressum</a>
        <a href="datenschutz.html" class="link-card">datenschutz</a>
      </div>
    </div>

    <!-- Dezentes Footer-Menü ganz unten -->
    <footer>
      <a href="impressum.html">impressum</a> | <a href="datenschutz.html">datenschutz</a>
    </footer>
  </main>

</body>
  </html>
