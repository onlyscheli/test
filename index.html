<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Luftpolsterfolie</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    background: #dce4e7;
    color: #52636b;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

/* MINIMALISTISCHE KOPFZEILE */

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: #e8edef;
    flex-shrink: 0;
}

h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.4px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    border: none;
    background: transparent;
    color: #52636b;
    font-size: 21px;
    min-width: 36px;
    min-height: 36px;
    cursor: pointer;
    border-radius: 8px;
    touch-action: manipulation;
}

button:active {
    background: #ccd7dc;
}

input[type="range"] {
    width: clamp(45px, 15vw, 110px);
    height: 4px;
    accent-color: #82979e;
    cursor: pointer;
}

/* ENTSPANNUNGSANZEIGE */

.relax-panel {
    background: #e8edef;
    padding: 4px 16px 15px;
    flex-shrink: 0;
}

.relax-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin-bottom: 8px;
}

#percent {
    color: #dc4545;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    transition: color 0.6s ease;
}

.progress {
    width: 100%;
    height: 8px;
    background: #cbd6da;
    border-radius: 20px;
    overflow: hidden;
}

#bar {
    width: 1%;
    height: 100%;
    border-radius: 20px;
    background: #dc4545;
    transition:
        width 0.4s ease,
        background-color 0.6s ease;
}

.info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    gap: 8px;
    font-size: 11px;
    color: #70828a;
}

#message {
    font-style: italic;
}

#count {
    font-variant-numeric: tabular-nums;
}

/* LUFTPOLSTERFOLIE */

main {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #b8c7cc;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
}

/* HANDY-ANSICHT */

@media (max-width: 450px) {

    header {
        padding-left: 12px;
        padding-right: 8px;
    }

    h1 {
        font-size: 14px;
    }

    .controls {
        gap: 4px;
    }

    .relax-panel {
        padding-left: 14px;
        padding-right: 14px;
    }

    .info {
        font-size: 10px;
    }
}

</style>
</head>

<body>

<header>

    <h1>Luftpolsterfolie</h1>

    <div class="controls">

        <button id="sound"
                aria-label="Ton ausschalten"
                aria-pressed="true"
                title="Ton ein / aus">🔊</button>

        <input id="speed"
               type="range"
               min="0"
               max="65"
               value="16"
               aria-label="Foliengeschwindigkeit"
               title="Foliengeschwindigkeit">

        <button id="fullscreen"
                aria-label="Vollbild"
                title="Vollbild">⛶</button>

    </div>

</header>

<!-- ENTSPANNUNGSANZEIGE OBEN -->

<section class="relax-panel">

    <div class="relax-header">
        <span>Entspannung</span>
        <span id="percent">0 %</span>
    </div>

    <div class="progress"
         role="progressbar"
         aria-label="Spielerischer Entspannungsfortschritt"
         aria-valuemin="0"
         aria-valuemax="100"
         aria-valuenow="0">

        <div id="bar"></div>

    </div>

    <div class="info">

        <span>
            <span id="count">0</span>
            Luftpolster zerdrückt
        </span>

        <span id="message">
            Einfach loslassen.
        </span>

    </div>

</section>

<!-- ENDLOSE LUFTPOLSTERFOLIE -->

<main id="area">
    <canvas id="canvas"></canvas>
</main>

<script>

"use strict";

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext(
    "2d",
    { alpha: false }
);

const area = document.getElementById("area");
const speed = document.getElementById("speed");

const countDisplay = document.getElementById("count");
const percentDisplay = document.getElementById("percent");
const bar = document.getElementById("bar");
const message = document.getElementById("message");
const progress = document.querySelector(".progress");

let width = 0;
let height = 0;
let cell = 52;
let columns = 6;

let bubbles = [];
let nextY = 0;
let lastFrame = 0;
let dirty = true;

let totalPops = 0;
let statsDirty = false;
let soundEnabled = true;

const pointers = new Map();
const sprites = {};

const random = (a, b) =>
    a + Math.random() * (b - a);


/* ==================================
   ENTSPANNUNGSANZEIGE
   ROT - ORANGE - GRÜN
================================== */

function updateStats() {

    // Spielerischer Fortschritt.
    // Keine tatsächliche Stressmessung.

    const relaxation = Math.min(
        100,
        Math.round(
            100 * (1 - Math.exp(-totalPops / 100))
        )
    );

    countDisplay.textContent =
        totalPops.toLocaleString("de-AT");

    percentDisplay.textContent =
        relaxation + " %";

    bar.style.width =
        Math.max(1, relaxation) + "%";

    // Fließender Farbwechsel:
    // 0 % = Rot
    // 50 % = Orange
    // 100 % = Grün

    const hue = relaxation <= 50
        ? relaxation * 0.6
        : 30 + (relaxation - 50) * 1.8;

    const color =
        `hsl(${hue}, 65%, 48%)`;

    bar.style.backgroundColor = color;
    percentDisplay.style.color = color;

    progress.setAttribute(
        "aria-valuenow",
        relaxation
    );

    let text;

    if (relaxation < 10) {

        text = "Einfach loslassen.";

    } else if (relaxation < 25) {

        text = "Ein bisschen Ruhe.";

    } else if (relaxation < 40) {

        text = "Der Alltag rückt in die Ferne.";

    } else if (relaxation < 60) {

        text = "Zeit nur für dich.";

    } else if (relaxation < 75) {

        text = "Immer schön gemütlich.";

    } else if (relaxation < 90) {

        text = "Nichts muss. Alles kann.";

    } else if (relaxation < 100) {

        text = "Einfach den Moment genießen.";

    } else {

        text = "Ruhemodus. Plopp weiter.";

    }

    if (message.textContent !== text) {
        message.textContent = text;
    }

    statsDirty = false;
}


/* ==================================
   REALISTISCHE LUFTPOLSTER
   Grafiken einmal vorberechnen
================================== */

function makeSprite(size, popped) {

    const image = document.createElement("canvas");

    image.width = size;
    image.height = size;

    const c = image.getContext("2d");

    const r = size * 0.45;

    c.translate(size / 2, size / 2);

    c.beginPath();

    c.ellipse(
        0, 0,
        r, r * 0.97,
        0, 0, Math.PI * 2
    );

    if (!popped) {

        const gradient = c.createRadialGradient(
            -r * 0.32,
            -r * 0.38,
            0,
            0, 0, r
        );

        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.13, "#f2f8fa");
        gradient.addColorStop(0.38, "#dce8ec");
        gradient.addColorStop(0.72, "#b7c9d0");
        gradient.addColorStop(0.92, "#8da3ad");
        gradient.addColorStop(1, "#e0eaed");

        c.shadowColor = "#435d6966";
        c.shadowBlur = size * 0.035;
        c.shadowOffsetY = size * 0.025;

        c.fillStyle = gradient;
        c.fill();

        c.shadowBlur = 0;
        c.shadowOffsetY = 0;

        c.strokeStyle = "#7b919b88";
        c.lineWidth = 1;
        c.stroke();

        // Schweißrand der Folie

        c.beginPath();

        c.ellipse(
            0, 0,
            r * 0.88,
            r * 0.86,
            0, 0, Math.PI * 2
        );

        c.strokeStyle = "#ffffff99";
        c.stroke();

        // Lichtreflexion

        c.beginPath();

        c.ellipse(
            -r * 0.32,
            -r * 0.42,
            r * 0.36,
            r * 0.15,
            -0.55,
            0, Math.PI * 2
        );

        c.fillStyle = "#ffffffdd";
        c.fill();

        // Unterer Glanzrand

        c.beginPath();

        c.arc(
            0, 0,
            r * 0.78,
            0.2, 1.3
        );

        c.strokeStyle = "#ffffff88";
        c.lineWidth = size * 0.022;
        c.stroke();

    } else {

        // Zerdrückte, zerknitterte Folie

        const gradient = c.createRadialGradient(
            0, 0, 0,
            0, 0, r
        );

        gradient.addColorStop(0, "#9eafb6");
        gradient.addColorStop(0.6, "#c9d5da");
        gradient.addColorStop(1, "#b4c3c9");

        c.fillStyle = gradient;
        c.fill();

        c.strokeStyle = "#879ba388";
        c.lineWidth = 1;
        c.stroke();

        c.clip();

        // Zufällige Knitterfalten

        for (let i = 0; i < 20; i++) {

            const a = random(0, Math.PI * 2);
            const end = random(r * 0.4, r);

            c.beginPath();

            c.moveTo(
                random(-r * 0.3, r * 0.3),
                random(-r * 0.3, r * 0.3)
            );

            c.lineTo(
                Math.cos(a) * end * 0.6,
                Math.sin(a) * end * 0.6
            );

            c.lineTo(
                Math.cos(a + 0.2) * end,
                Math.sin(a + 0.2) * end
            );

            c.strokeStyle = i % 2
                ? "#ffffff99"
                : "#647b8566";

            c.lineWidth = random(0.5, 1.6);

            c.stroke();
        }
    }

    return image;
}


function prepareSprites() {

    sprites.small = makeSprite(96, false);

    sprites.large = makeSprite(192, false);

    sprites.flat = Array.from(
        { length: 5 },
        () => makeSprite(96, true)
    );

    sprites.flatLarge = Array.from(
        { length: 5 },
        () => makeSprite(192, true)
    );
}


/* ==================================
   REALISTISCHE KNACKGERÄUSCHE
================================== */

let audio;
let master;
let activeSounds = 0;

const samples = {
    small: [],
    large: []
};


function initAudio() {

    if (!audio) {

        const AudioClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioClass) return false;

        audio = new AudioClass();

        master = audio.createGain();

        master.gain.value =
            soundEnabled ? 0.6 : 0;

        const compressor =
            audio.createDynamicsCompressor();

        compressor.threshold.value = -12;
        compressor.ratio.value = 6;

        master.connect(compressor);

        compressor.connect(audio.destination);

        // Geräusche einmal vorberechnen.

        for (let i = 0; i < 12; i++) {

            samples.small.push(makeCrack(false));

            samples.large.push(makeCrack(true));
        }
    }

    if (audio.state === "suspended") {

        audio.resume().catch(() => {});
    }

    return true;
}


function makeCrack(large) {

    const rate = audio.sampleRate;

    const duration = large
        ? 0.13
        : 0.065;

    const buffer = audio.createBuffer(
        1,
        Math.floor(rate * duration),
        rate
    );

    const data = buffer.getChannelData(0);

    const decay = large
        ? random(0.007, 0.013)
        : random(0.002, 0.004);

    const frequency = large
        ? random(95, 180)
        : random(300, 500);

    let previous = 0;

    for (let i = 0; i < data.length; i++) {

        const t = i / rate;

        const noise =
            Math.random() * 2 - 1;

        const smoothing = large
            ? 0.38
            : 0.85;

        previous +=
            smoothing * (noise - previous);

        const attack =
            Math.min(1, t / 0.0002);

        const crack =
            previous *
            Math.exp(-t / decay) *
            attack;

        const thump =
            Math.sin(
                2 * Math.PI * frequency * t *
                (1 - Math.min(t * 5, 0.6))
            ) *
            Math.exp(-t / 0.012) *
            (large ? 0.45 : 0.12);

        const rustle =
            noise *
            Math.exp(-t / 0.025) *
            0.045;

        data[i] = crack + thump + rustle;
    }

    return buffer;
}


function playPop(large) {

    if (!soundEnabled || !initAudio()) return;

    // Audio-Überlastung vermeiden.

    if (activeSounds >= 10) return;

    const list = large
        ? samples.large
        : samples.small;

    const source = audio.createBufferSource();

    const gain = audio.createGain();

    source.buffer =
        list[Math.floor(Math.random() * list.length)];

    source.playbackRate.value =
        random(0.9, 1.1);

    // Große Luftpolster sind deutlich lauter.

    gain.gain.value = large
        ? random(0.85, 1.05)
        : random(0.25, 0.42);

    source.connect(gain);

    gain.connect(master);

    activeSounds++;

    source.onended = () => {

        activeSounds--;

        source.disconnect();

        gain.disconnect();
    };

    source.start();
}


/* ==================================
   ENDLOSE FOLIENROLLE
================================== */

function addStrip(y) {

    const occupied = [
        Array(columns).fill(false),
        Array(columns).fill(false)
    ];

    for (let r = 0; r < 2; r++) {

        for (let c = 0; c < columns; c++) {

            if (occupied[r][c]) continue;

            let large = false;

            // Zufällig große Luftpolster einbauen.

            if (
                r === 0 &&
                c < columns - 1 &&
                !occupied[0][c + 1] &&
                !occupied[1][c] &&
                !occupied[1][c + 1] &&
                Math.random() < 0.17
            ) {

                large = true;

                occupied[0][c + 1] = true;
                occupied[1][c] = true;
                occupied[1][c + 1] = true;
            }

            occupied[r][c] = true;

            const size =
                cell * (large ? 2 : 1);

            bubbles.push({

                x: c * cell + size / 2,

                y: y + r * cell + size / 2,

                size,

                large,

                popped: false,

                variant:
                    Math.floor(Math.random() * 5)
            });
        }
    }
}


function resize() {

    width = area.clientWidth;

    height = area.clientHeight;

    if (width < 1 || height < 1) return;

    // Niedrige, ressourcenschonende Auflösung.

    canvas.width = width;

    canvas.height = height;

    columns = Math.max(
        4,
        Math.floor(width / 54)
    );

    cell = width / columns;

    bubbles = [];

    for (
        let y = -cell * 2;
        y < height + cell * 2;
        y += cell * 2
    ) {

        addStrip(y);
    }

    nextY = -cell * 2;

    dirty = true;

    draw();
}


/* ==================================
   FOLIE ZEICHNEN
================================== */

function draw() {

    ctx.fillStyle = "#b8c7cc";

    ctx.fillRect(
        0, 0, width, height
    );

    for (const b of bubbles) {

        // Unsichtbare Polster nicht zeichnen.

        if (
            b.y + b.size / 2 < 0 ||
            b.y - b.size / 2 > height
        ) continue;

        let sprite;

        if (b.popped) {

            sprite = b.large
                ? sprites.flatLarge[b.variant]
                : sprites.flat[b.variant];

        } else {

            sprite = b.large
                ? sprites.large
                : sprites.small;
        }

        ctx.drawImage(
            sprite,
            b.x - b.size / 2,
            b.y - b.size / 2,
            b.size,
            b.size
        );
    }

    dirty = false;
}


/* ==================================
   LUFTPOLSTER ZERDRÜCKEN
================================== */

function popAt(x, y) {

    for (const b of bubbles) {

        if (b.popped) continue;

        const dx = x - b.x;

        const dy = y - b.y;

        const radius = b.size * 0.46;

        if (
            dx * dx + dy * dy
            <= radius * radius
        ) {

            b.popped = true;

            totalPops++;

            statsDirty = true;

            dirty = true;

            playPop(b.large);

            return;
        }
    }
}


/* ==================================
   MAUS UND TOUCH
   MIT WISCHFUNKTION
================================== */

function position(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x: e.clientX - rect.left,

        y: e.clientY - rect.top
    };
}


canvas.addEventListener("pointerdown", e => {

    if (e.button !== 0) return;

    e.preventDefault();

    if (soundEnabled) initAudio();

    const p = position(e);

    pointers.set(e.pointerId, p);

    canvas.setPointerCapture(e.pointerId);

    popAt(p.x, p.y);
});


canvas.addEventListener("pointermove", e => {

    const old = pointers.get(e.pointerId);

    if (!old) return;

    const p = position(e);

    const dx = p.x - old.x;

    const dy = p.y - old.y;

    const steps = Math.max(
        1,
        Math.ceil(Math.hypot(dx, dy) / 12)
    );

    // Auch bei schnellem Wischen
    // die Luftpolster dazwischen zerdrücken.

    for (let i = 1; i <= steps; i++) {

        popAt(

            old.x + dx * i / steps,

            old.y + dy * i / steps
        );
    }

    pointers.set(e.pointerId, p);
});


function release(e) {

    pointers.delete(e.pointerId);
}


canvas.addEventListener(
    "pointerup", release
);

canvas.addEventListener(
    "pointercancel", release
);

canvas.addEventListener(
    "lostpointercapture", release
);


window.addEventListener("blur", () => {

    pointers.clear();
});


/* ==================================
   RESSOURCENSCHONENDE ANIMATION
   MAXIMAL 30 FPS
================================== */

function animate(time) {

    requestAnimationFrame(animate);

    if (document.hidden) {

        lastFrame = time;

        return;
    }

    const elapsed = time - lastFrame;

    if (elapsed < 1000 / 30 - 1) return;

    const dt = Math.min(
        elapsed / 1000,
        0.1
    );

    lastFrame = time;

    const movement =
        Number(speed.value) * dt;

    if (movement > 0) {

        // Folie bewegt sich nach unten.

        for (const b of bubbles) {

            b.y += movement;
        }

        nextY += movement;

        // Alte Luftpolster entfernen.

        bubbles = bubbles.filter(

            b => b.y - b.size / 2 < height
        );

        // Neue Folie von oben nachschieben.

        while (nextY >= 0) {

            nextY -= cell * 2;

            addStrip(nextY);
        }

        dirty = true;
    }

    // Auch bei stillstehendem Finger
    // vorbeikommende Polster zerdrücken.

    for (const p of pointers.values()) {

        popAt(p.x, p.y);
    }

    if (dirty) draw();

    if (statsDirty) updateStats();
}


/* ==================================
   TON EIN UND AUS
================================== */

const soundButton =
    document.getElementById("sound");


soundButton.addEventListener("click", () => {

    soundEnabled = !soundEnabled;

    soundButton.textContent =
        soundEnabled ? "🔊" : "🔇";

    soundButton.setAttribute(
        "aria-pressed",
        String(soundEnabled)
    );

    soundButton.setAttribute(
        "aria-label",
        soundEnabled
            ? "Ton ausschalten"
            : "Ton einschalten"
    );

    if (soundEnabled) initAudio();

    if (master) {

        master.gain.setTargetAtTime(

            soundEnabled ? 0.6 : 0,

            audio.currentTime,

            0.005
        );
    }
});


/* ==================================
   VOLLBILDMODUS
================================== */

const full =
    document.getElementById("fullscreen");


if (!document.documentElement.requestFullscreen) {

    full.hidden = true;
}


full.addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement
                .requestFullscreen();

        } else {

            await document.exitFullscreen();
        }

    } catch (e) {}
});


/* ==================================
   FENSTERGRÖSSE ANPASSEN
================================== */

let resizeTimer;


window.addEventListener("resize", () => {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(resize, 150);
});


/* ==================================
   START
================================== */

prepareSprites();

resize();

updateStats();

lastFrame = performance.now();

requestAnimationFrame(animate);

</script>

</body>
</html>
